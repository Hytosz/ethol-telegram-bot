name: ETHOL Presence Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode Eksekusi'
        required: true
        default: 'CRON'
        type: choice
        options:
          - CRON
          - TEST

jobs:
  check-ethol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ETHOL Bot
        env:
          PENS_NRP: ${{ secrets.PENS_NRP }}
          PENS_PASSWORD: ${{ secrets.PENS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKBACK_MINUTES: "120"
          BOT_MODE: ${{ github.event.inputs.mode || 'CRON' }}
        run: |
          python bot.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "Update presence history [skip ci]" || exit 0
          git push || true
